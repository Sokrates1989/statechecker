<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statechecker Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Statechecker Admin</h1>
      <div class="header-status">
        <span class="refresh-info">
          <button class="refresh-icon-btn" id="refreshIcon" title="Refresh all data">
            <svg class="refresh-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
          <span class="last-refresh">Last: <span id="lastRefresh">-</span></span>
          <span class="auto-refresh-info">(auto: 1m)</span>
        </span>
      </div>
    </header>

    <main>
      <div class="grid">
        <section class="card">
          <div class="row">
            <div style="flex: 1">
              <label for="token">SERVER_AUTHENTICATION_TOKEN</label>
              <input id="token" type="password" placeholder="paste token" />
            </div>
          </div>
          <div style="height: 12px"></div>
          <div class="row">
            <button class="primary" id="btnSave">Save</button>
            <button id="btnReload">Reload</button>
          </div>
          <div id="status" class="status"></div>
        </section>

        <section class="card">
          <div class="tabs" id="tabs">
            <button class="tab active" data-tab="tools">Tools</button>
            <button class="tab" data-tab="websites">Websites</button>
            <button class="tab" data-tab="backups">Backups</button>
            <button class="tab" data-tab="gdrive">Google Drive</button>
          </div>
          <div style="height: 12px"></div>

          <div id="panel-tools" class="panel">
            <div class="row">
              <button class="primary" id="toolsRefresh">Refresh</button>
            </div>
            <div style="height: 10px"></div>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Status</th>
                  <th>Frequency</th>
                  <th>Override</th>
                  <th>Last up</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="toolsBody"></tbody>
            </table>
          </div>

          <div id="panel-websites" class="panel" style="display:none">
            <div class="row">
              <div style="flex: 1">
                <label>New website URL</label>
                <input id="websiteUrl" placeholder="https://example.com/health" />
              </div>
              <button class="primary" id="websiteAdd">Add</button>
              <button id="websitesRefresh">Refresh</button>
            </div>
            <div style="height: 10px"></div>
            <table>
              <thead>
                <tr>
                  <th>URL</th>
                  <th>State</th>
                  <th>Down msg sent</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="websitesBody"></tbody>
            </table>
          </div>

          <div id="panel-backups" class="panel" style="display:none">
            <div class="row">
              <button class="primary" id="backupsRefresh">Refresh</button>
            </div>
            <div style="height: 10px"></div>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Frequency</th>
                  <th>Override</th>
                  <th>Most recent</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="backupsBody"></tbody>
            </table>
          </div>

          <div id="panel-gdrive" class="panel" style="display:none">
            <div class="two">
              <div>
                <label>Folder JSON (one object)</label>
                <textarea id="gdriveFolderJson" class="mono" spellcheck="false"></textarea>
                <div class="status">Example keys: <span class="mono">name, description, folderID, token, stateCheckFrequency_inMinutes</span></div>
              </div>
              <div>
                <label>Remove by name</label>
                <input id="gdriveRemoveName" placeholder="Folder name" />
                <div style="height: 10px"></div>
                <div class="row">
                  <button class="primary" id="gdriveUpsert">Add/Update</button>
                  <button class="danger" id="gdriveRemove">Remove</button>
                  <button id="gdriveRefresh">Refresh</button>
                </div>
                <div style="height: 10px"></div>
                <label>Configured folders</label>
                <textarea id="gdriveList" class="mono" spellcheck="false" readonly></textarea>
              </div>
            </div>
          </div>

        </section>
      </div>
    </main>

    <footer>
      <p>Statechecker Admin | API: <span id="apiVersion">loading...</span> | Web: <span id="webVersion">loading...</span></p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
