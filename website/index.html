<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statechecker - Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%237c3aed'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=3">
    <script src="keycloak-config.js?v=4"></script>
    <script src="keycloak.js?v=4"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-bar">
                <div class="header-title">
                    <h1>Statechecker</h1>
                    <p class="subtitle">State Monitoring & Alerts</p>
                </div>
                <div class="header-actions">
                    <div id="userBadge" class="user-badge hidden">
                        <span class="user-label">Signed in as</span>
                        <span id="userName" class="user-name"></span>
                    </div>
                    <button id="logoutBtn" class="btn btn-primary btn-sm hidden">Logout</button>
                </div>
            </div>
        </header>
        
        <div id="status-message" class="status hidden">
            <div class="status-text"></div>
            <button type="button" class="status-close" aria-label="Dismiss status message">×</button>
        </div>

        <!-- Login Section (Keycloak only) -->
        <section id="login-section" class="card">
            <h2>Single Sign-On</h2>
            <p class="subtitle">Sign in with your Keycloak account to manage state checks.</p>
            <button id="loginBtn" class="btn btn-primary">Login with Keycloak</button>
            <p id="login-session" class="hint hidden">Active session detected for <span id="login-session-name"></span>. Click continue to enter.</p>
            <p id="login-error" class="error hidden"></p>
        </section>

        <!-- Main Content (hidden until authenticated) -->
        <section id="main-section" class="hidden">
            <!-- Navigation Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="tools">Tools</button>
                <button class="tab" data-tab="websites">Websites</button>
                <button class="tab" data-tab="backups">Backups</button>
                <button class="tab" data-tab="gdrive">Google Drive</button>
            </div>

            <!-- Tab Contents (loaded dynamically) -->
            <div id="tab-content-container">
                <p class="loading">Loading...</p>
            </div>

            <div id="status-message-bottom" class="status hidden">
                <div class="status-text"></div>
                <button type="button" class="status-close" aria-label="Dismiss status message">×</button>
            </div>
        </section>

        <footer>
            <p>Statechecker | API: <span id="apiVersion">...</span> | Web: <span id="webVersion">...</span></p>
        </footer>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
