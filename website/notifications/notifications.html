<div id="notifications-tab" class="tab-content">
    <div class="card">
        <h2 id="notifications-title"></h2>
        <p id="notifications-hint" class="hint"></p>
        <p id="notifications-disabled" class="hint hidden" role="status"></p>
        <div class="form-group">
            <strong id="notifications-error-label"></strong>
            <p id="notifications-error-chats"></p>
        </div>
        <div class="form-group">
            <strong id="notifications-info-label"></strong>
            <p id="notifications-info-chats"></p>
        </div>
        <div class="form-group">
            <label for="notifications-level" id="notifications-level-label"></label>
            <select id="notifications-level"></select>
        </div>
        <div class="form-actions">
            <button type="button" id="notifications-send" class="btn btn-primary"></button>
        </div>
    </div>
</div>
